const d64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(pw){
  const k0=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:d64(B.s),iterations:B.n,hash:"SHA-256"},k0,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:d64(B.i)},k,d64(B.c));
  return new TextDecoder().decode(pt);
}
function show(html){document.open();document.write(html);document.close()}
const f=document.getElementById("f");
(async()=>{
  let saved=null;try{saved=localStorage.getItem("kapital_pw")}catch(e){}
  if(saved){try{show(await open_(saved));return}catch(e){try{localStorage.removeItem("kapital_pw")}catch(_){}}}
  f.classList.remove("hide");document.getElementById("pw").focus();
})();
f.onsubmit=async e=>{
  e.preventDefault();const pw=document.getElementById("pw").value;const err=document.getElementById("err");
  err.textContent="…";
  try{const html=await open_(pw);if(document.getElementById("rem").checked){try{localStorage.setItem("kapital_pw",pw)}catch(_){}}show(html)}
  catch(x){err.textContent="Неверный пароль"}
};
</script>
