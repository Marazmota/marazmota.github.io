<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Лист не найден — POLYMER 3D LAB</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
@font-face{font-family:"Tektur";src:url("/fonts/tektur.woff") format("woff");font-weight:400 900;font-stretch:75% 100%;font-display:swap}
@font-face{font-family:"Golos Text";src:url("/fonts/golos-text.woff") format("woff");font-weight:400 900;font-display:swap}
@font-face{font-family:"JetBrains Mono";src:url("/fonts/jetbrains-mono.woff") format("woff");font-weight:100 800;font-display:swap}
:root{color-scheme:light dark;--paper:#E4E0D6;--paper-2:#D9D4C8;--ink:#16181B;--muted:#53554F;--grid:#D3CEC2;--accent:#2547F5;--on-accent:#fff;--ease:cubic-bezier(0.2,0.8,0.2,1)}
@media (prefers-color-scheme:dark){:root{--paper:#131517;--paper-2:#1A1D20;--ink:#E9E6DE;--muted:#9C9D95;--grid:#1D2023;--accent:#C5F04A;--on-accent:#0E0F12}}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;background:var(--paper);color:var(--ink);font:400 17px/1.6 "Golos Text",system-ui,sans-serif;padding:20px}
::selection{background:var(--accent);color:var(--on-accent)}
:focus-visible{outline:2px dashed var(--ink);outline-offset:3px}
.sheet{width:100%;max-width:960px;margin:0 auto;border:1.5px solid var(--ink);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;background-position:-1px -1px}
.in{padding:48px 24px 40px}
.label{font:500 13px/1.3 "JetBrains Mono",ui-monospace,monospace;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:0}
h1{margin:16px 0 0;font:800 clamp(5rem,26vw,11rem)/.85 "Tektur",sans-serif;font-stretch:78%;letter-spacing:-.04em}
h1 span{color:var(--accent)}
p.lead{margin:24px 0 0;max-width:40ch;font-size:1.4167rem;line-height:1.35}
.acts{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
.btn{display:inline-flex;align-items:center;min-height:52px;padding:0 24px;border:1.5px solid var(--ink);border-radius:2px;font:600 17px/1 "Golos Text",sans-serif;text-decoration:none;color:var(--ink);transition:background-color 200ms var(--ease),color 200ms var(--ease)}
.btn--primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn--primary:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn--ghost:hover{background:var(--paper-2)}
.stamp{width:100%;border-collapse:collapse;font:500 13px/1.3 "JetBrains Mono",monospace;background:var(--paper)}
.stamp td,.stamp th{border-top:1.5px solid var(--ink);padding:8px 12px;text-align:left}
.stamp td+td,.stamp th+td{border-left:1.5px solid var(--ink)}
.stamp th{font-weight:500;color:var(--muted);text-transform:uppercase;width:1%;white-space:nowrap}
@media (min-width:768px){.in{padding:72px 64px 56px}}
</style>
</head>
<body>
<main class="sheet">
  <div class="in">
    <p class="label">Ошибка · такого листа нет в комплекте</p>
    <h1>404<span>.</span></h1>
    <p class="lead">Страница не найдена. Возможно, ссылка устарела — всё актуальное на главной.</p>
    <div class="acts">
      <a class="btn btn--primary" href="/">На главную</a>
      <a class="btn btn--ghost" href="https://t.me/polymer_3d_lab">Написать в Telegram</a>
    </div>
  </div>
  <table class="stamp"><tr><th>Лист</th><td>404</td><th>Изделие</th><td>POLYMER 3D LAB · Набережные Челны</td></tr></table>
</main>
</body>
</html>
